info:
  name: GetOAuthProviderById
  type: http
  seq: 5

http:
  method: GET
  url: "{{ApiBaseUrl}}/user/{{TEMP_userId}}/providers/{{TEMP_providerId}}"
  headers:
    - name: x-trace-id
      value: "{{TEMP_trace_id}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const uuid = require('uuid');
        bru.setEnvVar("TEMP_trace_id", uuid.v4());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
