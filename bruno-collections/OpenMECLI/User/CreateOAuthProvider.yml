info:
  name: CreateOAuthProvider
  type: http
  seq: 3

http:
  method: POST
  url: "{{ApiBaseUrl}}/user/{{TEMP_userId}}/providers"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "oauthProviderName": "Google"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          const data = res.getBody();
          bru.setEnvVar("TEMP_providerId", data.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
