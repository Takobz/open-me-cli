name: OpenME API Build and Deploy
run-name: OpenME API Build and Deploy
on:
    push:
        branches: [main]
jobs:
    docker-build-and-push:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Pipeline triggered by ${{ github.actor }}"

            - name: Git Checkout the repo
              uses: actions/checkout@v4

            - name: SetUp Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log Into Docker
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PAT_TOKEN }}

            - name: Build and Push Image
              uses: docker/build-push-action@v6
              with:
                context: ${{ github.workspace }}/app/src
                file: ${{ github.workspace }}/app/src/Dockerfile
                tags: khutsokobela/openme-cli:latest
                platforms: linux/amd64,linux/arm64
                push: true